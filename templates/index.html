<!DOCTYPE html>
<html>
<head>
    <title>Health GenAI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f8;
        }

        .chat-container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .bubble {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background-color: #d1e7ff;
            align-self: flex-end;
            margin-left: auto;
        }

        .bot {
            background-color: #eaeaea;
            align-self: flex-start;
        }

        .input-box {
            margin-top: 20px;
            display: flex;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
        }
    </style>
</head>

<body>
<div class="chat-container">

    <h2>Health GenAI Assistant</h2>

    {% for msg in chat %}
        <div class="bubble user">
            <b>You:</b> {{ msg.question }}
        </div>

        <div class="bubble bot">
            <b>Assistant:</b> {{ msg.answer }}
        </div>
    {% endfor %}

    <form method="POST" class="input-box">
        <input type="text" name="question" placeholder="Ask a health analytics question..." required>
        <button type="submit">Send</button>
    </form>

</div>
</body>
</html>
